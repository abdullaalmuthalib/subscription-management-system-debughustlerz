{% extends 'base.html' %}
{% block title %}Enter New Password - Brightloop Software{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <div class="card-header" style="justify-content: center; flex-direction: column; text-align: center; gap: 0.25rem;">
            <h2 class="card-title">Set New Password</h2>
            <p style="font-size: 0.85rem; color: var(--gray-600);">Please create a secure password</p>
        </div>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required autofocus>
                <small style="color: var(--gray-600); font-size: 0.78rem; display: block; margin-top: 0.25rem;">
                    Must be &gt;8 characters, with 1 uppercase, 1 lowercase, and 1 special character.
                </small>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.7rem;">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
