{% extends 'base.html' %}
{% block title %}Forgot Password - Brightloop Software{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <div class="card-header" style="justify-content: center; flex-direction: column; text-align: center; gap: 0.25rem;">
            <h2 class="card-title">Reset Your Password</h2>
            <p style="font-size: 0.85rem; color: var(--gray-600);">We will dispatch a secure reset link to your email</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label class="form-label">Registered Email</label>
                <input type="email" name="email" class="form-control" placeholder="name@company.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.7rem;">
                Send Reset Link
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem;">
            <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none;">&larr; Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
