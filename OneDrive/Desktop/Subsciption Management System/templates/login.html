{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary"><i class="fa-solid fa-lock"></i> Welcome Back</h3>
                <p class="text-muted">Log in to manage subscriptions</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email address</label>
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="name@company.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Login</button>
            </form>
            <div class="text-center">
                <p class="mb-1">Don't have an account? <a href="/register" class="text-decoration-none">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
